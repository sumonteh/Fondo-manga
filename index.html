<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Fondo Manga v5 transforma fotos y renders en fondos manga por capas, en el dispositivo.">
  <title>Fondo Manga v5</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Fondo <span>マンガ</span> Manga <small>v5</small></h1>
      <p>Fondos manga por capas: líneas jerárquicas, masas negras, blancos reservados y exportación local.</p>
    </div>
    <div class="status-pill" id="workerStatus">Motor listo</div>
  </header>

  <div class="app-shell">
    <aside class="sidebar" aria-label="Controles">
      <section class="panel upload-panel">
        <h2>Foto o render</h2>
        <button id="drop" class="drop-zone" type="button">
          <strong>Toca o arrastra una imagen</strong>
          <span>JPG, PNG o WebP · todo se procesa en este dispositivo</span>
        </button>
        <input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/*">
      </section>

      <section class="panel">
        <h2>Preset</h2>
        <div class="preset-grid" id="presetGrid"></div>
        <div class="inline-actions">
          <button class="mini" id="savePreset" type="button">Guardar preset</button>
          <button class="mini" id="resetSettings" type="button">Restablecer</button>
        </div>
      </section>

      <section class="panel tabs-panel">
        <div class="tabs" role="tablist">
          <button class="active" data-tab="principal" type="button">Principal</button>
          <button data-tab="linea" type="button">Línea</button>
          <button data-tab="tonos" type="button">Tonos</button>
          <button data-tab="avanzado" type="button">Avanzado</button>
        </div>

        <div class="tab-page active" id="tab-principal">
          <label class="field">
            <span>Tipo de escena</span>
            <select id="sceneType"></select>
          </label>
          <label class="field">
            <span>Formato de exportación</span>
            <select id="exportFormat"></select>
          </label>
          <div class="control" data-key="detail"></div>
          <div class="control" data-key="cleanup"></div>
          <div class="control" data-key="whiteReserve"></div>
          <div class="control" data-key="blackMass"></div>
          <div class="control" data-key="texture"></div>
        </div>

        <div class="tab-page" id="tab-linea">
          <div class="control" data-key="mainLine"></div>
          <div class="control" data-key="secondaryLine"></div>
          <div class="control" data-key="edgeContinuity"></div>
          <div class="control" data-key="farDetail"></div>
        </div>

        <div class="tab-page" id="tab-tonos">
          <div class="control" data-key="shadowThreshold"></div>
          <div class="control" data-key="toneCount"></div>
          <div class="control" data-key="transitionHardness"></div>
          <label class="field">
            <span>Trama</span>
            <select id="textureMode"></select>
          </label>
        </div>

        <div class="tab-page" id="tab-avanzado">
          <details class="advanced" open>
            <summary>Controles avanzados</summary>
            <label class="check"><input id="depthEnabled" type="checkbox"> Profundidad vertical</label>
            <label class="check"><input id="skyProtect" type="checkbox"> Proteger cielos y zonas claras superiores</label>
            <label class="check"><input id="architectureBoost" type="checkbox"> Reforzar arquitectura</label>
            <label class="check"><input id="organicRegions" type="checkbox"> Detectar textura orgánica</label>
          </details>
        </div>
      </section>

      <section class="panel">
        <h2>Proyecto</h2>
        <div class="stack-actions">
          <button class="btn secondary" id="undoBtn" type="button">Deshacer</button>
          <button class="btn secondary" id="redoBtn" type="button">Rehacer</button>
          <button class="btn secondary" id="newProject" type="button">Proyecto nuevo</button>
          <button class="btn secondary" id="exportConfig" type="button">Exportar JSON</button>
          <label class="btn secondary file-label">Importar JSON<input id="importConfig" type="file" accept="application/json,.json"></label>
        </div>
      </section>

      <section class="panel">
        <h2>Exportación</h2>
        <div class="stack-actions">
          <button class="btn" id="downloadFinal" type="button" disabled>Descargar PNG final</button>
          <button class="btn" id="downloadZip" type="button" disabled>Descargar capas ZIP</button>
          <button class="btn danger" id="cancelJob" type="button" disabled>Cancelar</button>
        </div>
      </section>
    </aside>

    <main class="workspace">
      <section class="viewer-toolbar" aria-label="Vista">
        <button class="mini" id="fitBtn" type="button">Ajustar</button>
        <button class="mini" id="zoomOut" type="button">-</button>
        <output id="zoomLabel">100%</output>
        <button class="mini" id="zoomIn" type="button">+</button>
        <button class="mini" id="panReset" type="button">Centrar</button>
      </section>

      <section class="viewer" id="viewer">
        <div class="frame" id="frame">
          <div class="empty-state" id="emptyState">
            <div class="kanji">背景</div>
            <p>Sube una foto o render para generar un fondo manga v5.</p>
          </div>
          <canvas id="resultCanvas" hidden></canvas>
          <canvas id="originalCanvas" hidden></canvas>
          <div class="compare-mask" id="compareMask" hidden></div>
        </div>
      </section>

      <section class="compare-row">
        <label class="compare-control">
          <span>Original / Resultado</span>
          <input id="compareSlider" type="range" min="0" max="100" value="0" disabled>
        </label>
      </section>

      <section class="progress-box" aria-live="polite">
        <div class="progress-header">
          <span id="statusText">Sin imagen cargada.</span>
          <output id="progressText">0%</output>
        </div>
        <progress id="progressBar" value="0" max="100"></progress>
      </section>
    </main>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
